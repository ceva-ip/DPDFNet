name: Native integration
on:
  push:
    paths: ['optimized_inference/**', '.github/workflows/native-integration.yml']
  pull_request:
    paths: ['optimized_inference/**', '.github/workflows/native-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release shared (PGO)
            pgo: true
          - name: Release static
            pgo: false
            config: '-DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF'
          - name: ASan and UBSan
            pgo: false
            config: '-DCMAKE_BUILD_TYPE=RelWithDebInfo -DDPDF_SANITIZE=ON -DBUILD_SHARED_LIBS=ON'
    name: ${{ matrix.name }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: optimized_inference
    steps:
      - uses: actions/checkout@v4
      - name: Verify both model weights
        run: sha256sum -c models/SHA256SUMS
      - name: Build recommended PGO release and run contracts
        if: matrix.pgo
        run: python3 tools/build.py --build-dir build/ci --jobs 2
      - name: Configure static or sanitizer build
        if: '!matrix.pgo'
        run: cmake -S . -B build/ci ${{ matrix.config }} -DDPDF_PGO_MODE=OFF -DBUILD_TESTING=ON
      - name: Build
        if: '!matrix.pgo'
        run: cmake --build build/ci -j 2
      - name: Run contracts for both models
        if: '!matrix.pgo'
        run: ctest --test-dir build/ci --output-on-failure --parallel 1
